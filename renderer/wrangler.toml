# YourTownPros listing renderer Worker.
# Deployed by .github/workflows/deploy-and-delta.yml on push to main.
# workers.dev only: no routes and no custom domain are defined here on purpose.
# The yourtownpros.com zone is never routed to this Worker from this file.
name = "yourtownpros-listings"
main = "worker.mjs"
compatibility_date = "2026-11-14"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "yourtownpros-listings"
database_id = "845f5cc7-19ad-4d75-b720-a1289ff48fd1"

# Cap CPU per invocation at 50 ms (Workers Paid standard is 30 ms;
# 50 ms is headroom, and the renderer design target is p95 <= 7 ms).
[limits]
cpu_ms = 50

# Workers Logs on, sampled at 10 percent of invocations. No Logpush.
[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 0.1

# matchfix deploy retrigger 2026-11-16 (no config change)
